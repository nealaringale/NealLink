name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform/build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Print toolchain
        run: |
          java -version
          gradle --version

      - name: Configure persistent signing when secrets are available
        env:
          KEYSTORE_B64: ${{ secrets.NEALLINK_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.NEALLINK_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NEALLINK_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NEALLINK_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 --decode > neallink-release.jks
            cat > keystore.properties <<EOF
          storeFile=neallink-release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
            echo "Persistent release signing configured."
          else
            echo "Persistent signing secrets are not configured; release APK will use the debug key for this build."
          fi

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace --warning-mode all assembleDebug

      - name: Build release APK
        run: gradle --no-daemon --stacktrace --warning-mode all assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NealLink-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: NealLink-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
